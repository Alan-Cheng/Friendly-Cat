<section class="message-dialog">
  <img *ngIf="imgPath" class="message-image" [src]="imgPath" alt="">
  <h2 mat-dialog-title>{{ title }}</h2>
  <div mat-dialog-content class="message-content"><p>{{ message }}</p></div>
  <div mat-dialog-actions class="message-actions">
    <button type="button" cdkFocusInitial (click)="close()">{{ closeMessage }}</button>
  </div>
</section>
