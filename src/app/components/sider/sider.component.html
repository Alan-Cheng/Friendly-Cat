<mat-toolbar class="toolbar" [class.world-toolbar]="worldMode">
  <button mat-icon-button (click)="toggleSidebar()" [attr.aria-label]="sidebarOpen && !detailMode ? '收合會員與收藏選單' : '展開會員與收藏選單'" [attr.aria-expanded]="sidebarOpen && !detailMode" aria-controls="world-sidebar"><mat-icon>menu</mat-icon></button>
  <span class="text-with-shadow">友善黑貓 Friendly Cat</span>
</mat-toolbar>
<dialog #sidebarWindow id="world-sidebar" class="sidebar" [class.is-closing]="sidebarClosing" [class.tour-sidebar]="tourMode" (cancel)="onSidebarCancel($event)" aria-labelledby="sidebar-title" closedby="any" (close)="onPanelClosed(sidebarWindow)" (pointerdown)="onPanelPointerDown($event)" (click)="onPanelClick($event)" (touchstart)="onPanelTouchStart($event, false)" (touchend)="onPanelTouchEnd($event, false)" (touchcancel)="cancelPanelTouch()">
  <div class="sidebar-menu">
  <header class="sidebar-header"><div><h2 id="sidebar-title">FRIENDLY CAT</h2></div><button type="button" (click)="closeSidebar()" class="close-btn" aria-label="關閉會員與收藏選單">×</button></header>
  <div class="sidebar-body">
    <p class="sidebar-intro">{{ user ? user.displayName + '，今天想找什麼？' : '登入後，把喜歡的商店收藏起來。' }}</p>
    <app-food-search *ngIf="!worldMode" [foodDetails711]="foodDetails711" [foodDetailsFamilyMart]="foodDetailsFamilyMart" (foodSelected)="openFoodResult($event)"></app-food-search>
    <section class="favorites-section" aria-labelledby="sidebar-favorites-title"><h3 id="sidebar-favorites-title">收藏店家</h3>
      <p class="empty-favorites" *ngIf="!user || !favoriteStores.length">{{ user ? '還沒有收藏的店家。' : '登入後，就能保存常去的門市。' }}</p>
      <ul *ngIf="user"><li *ngFor="let store of favoriteStores"><button type="button" class="store-item" (click)="openFavoriteStore(store)"><img class="favorite-brand-logo" [src]="isSevenElevenFavorite(store) ? sevenElevenIconUrl : familyMartIconUrl" [alt]="isSevenElevenFavorite(store) ? '7-ELEVEN' : '全家'" width="24" height="24" decoding="async"><span class="store-name">{{ favoriteStoreName(store) }}</span><svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12"/></svg></button></li></ul>
    </section>

  </div>
  <footer class="login-section">
    <a class="version-link" [href]="worldMode ? '/classic' : '/'" (click)="openVersion($event)">{{ worldMode ? '舊版頁面' : '地圖頁面' }}<svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg></a>
    <button *ngIf="worldMode" type="button" class="tour-link" (click)="openTutorial()">網站導覽<svg class="navigation-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12"/></svg></button>
    <button type="button" class="login-btn" (click)="openAccount()">{{ user ? '登出帳號' : '登入／建立帳號' }}</button>
  </footer>
  </div>
</dialog>
<dialog #detailsWindow id="store-details" class="sidebar store-details" [class.is-closing]="sidebarClosing" aria-labelledby="product-window-title" closedby="any" (cancel)="onSidebarCancel($event)" (close)="onPanelClosed(detailsWindow)" (pointerdown)="onPanelPointerDown($event)" (click)="onPanelClick($event)" (touchstart)="onPanelTouchStart($event, true)" (touchend)="onPanelTouchEnd($event, true)" (touchcancel)="cancelPanelTouch()">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sidebar-details"><ng-content select="[storeDetail]"></ng-content></div>
</dialog>
